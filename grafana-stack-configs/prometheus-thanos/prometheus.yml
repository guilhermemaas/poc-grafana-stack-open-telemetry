global:
  scrape_interval: 15s
  external_labels:
    cluster: 'prometheus-thanos'
    monitor: 'prometheus-thanos-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'flask_application'
    static_configs:
      - targets: ['host.docker.internal:5000']
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']      