auth_enabled: false

server:
  http_listen_port: 3200
  
distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  trace_idle_period: 10s
  #max_block_bytes: 1524288000

storage:
  trace:
    backend: s3
    s3:
      endpoint: minio:9000
      bucket: tempo
      access_key: minioadmin
      secret_key: minioadmin
      insecure: true

