global:
  scrape_interval: 15s

rule_files:
  - 'rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093' 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'service_a'
    static_configs:
      - targets: ['service_a:5000']
  
  - job_name: 'service_b'
    static_configs:
      - targets: ['service_b:5000']
  
  - job_name: 'service_c'
    static_configs:
      - targets: ['service_c:5000']
  
  - job_name: 'posicoes'
    static_configs:
      - targets: ['posicoes:5000']               
  
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']      
  
  - job_name: 'tempo_metrics'
    static_configs:
      - targets: ['tempo:3200']
  
  - job_name: 'grafana_agent_metrics'
    static_configs:
      - targets: ['grafana-agent:4242']      
  
  - job_name: 'iss'
    scrape_interval: 5m
    static_configs:
      - targets: ['iss:8899']