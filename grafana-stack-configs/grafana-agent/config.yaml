server:
  log_level: debug
  #http_listen_port: 12345

logs:
  configs:
    - name: default
      positions:
        filename: /tmp/positions.yaml
      clients:
        - url: http://loki:3100/loki/api/v1/push
      scrape_configs:
        - job_name: api-posicao
          static_configs:
            - targets: [localhost]
              labels:
                job: service_a
                service_name: service_a
                __path__: /log/service_a.log
          pipeline_stages:
            - json:
                expressions:
                  trace_id: record.extra.extra.trace_id
                  span_id: record.extra.extra.span_id
            - labels:
                trace_id: ""
                span_id: ""                 
        - job_name: service_b
          static_configs:
            - targets: [localhost]
              labels:
                job: service_b
                service_name: service_b
                __path__: /log/service_b.log
          pipeline_stages:
            - json:
                expressions:
                  trace_id: record.extra.extra.trace_id
                  span_id: record.extra.extra.span_id
            - labels:
                trace_id: ""
                span_id: ""
        - job_name: service_c
          static_configs:
            - targets: [localhost]
              labels:
                job: service_c
                service_name: service_c
                __path__: /log/service_c.log
          pipeline_stages:
            - json:
                expressions:
                  trace_id: record.extra.extra.trace_id
                  span_id: record.extra.extra.span_id
            - labels:
                trace_id: ""
                span_id: ""                                            

traces:
  configs:
    - name: default
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
      remote_write:
        - endpoint: http://tempo:4318
          protocol: 'http'
          insecure: true
      batch:
        timeout: 10s
        send_batch_size: 100
        #send_batch_max_size: 1524288000
      service_graphs:
        enabled: true
        #metrics_prefix: service_graphs
        wait: 10s
      spanmetrics:
        #enabled: true
        #metrics_prefix: spanmetrics
        latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
        handler_endpoint: '0.0.0.0:4242'

metrics:
  configs:
    - name: default
      scrape_configs:
        - job_name: local_scrape
          static_configs:
            - targets: ['127.0.0.1:12345']
      remote_write:
        - url: 'http://prometheus:9090/api/v1/write'