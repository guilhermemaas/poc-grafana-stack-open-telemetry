global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'opsgenie'
  routes:
    - match:
        severity: 'critical'
      receiver: 'opsgenie'  

receivers:
  - name: 'opsgenie'
    opsgenie_configs:
    - api_key:
      send_resolved: true
